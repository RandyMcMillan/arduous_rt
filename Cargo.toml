[package]
name = "arduous_rt"
version = "0.8.0"
edition = "2024"
readme = "README.md"
exclude = [".cargo/config.toml"]
description = "Process-global named Tokio runtimes with nesting, reentrancy-safe execution, and stress-testing helpers"
license = "MIT"
repository = "https://github.com/RandyMcMillan/arduous_rt"
keywords = ["tokio", "runtime", "async", "concurrency"]
categories = ["asynchronous", "concurrency"]
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true

[features]
# Downstream users must also set RUSTFLAGS="--cfg tokio_unstable" for the
# console feature to produce data (see .cargo/config.toml in this repo).
console = ["dep:console-subscriber"]
unbounded = []
explicit_name = []
glob_support = ["explicit_name", "dep:globset"]
# Superset of the name filters: adds deny rules, per-pattern quotas,
# introspection, and audit events. See docs/governance-plan.md.
governance = ["explicit_name", "glob_support"]
# Declarative policy loading (TOML). Implies governance; pulls in
# serde/toml, kept out of the base dependency tree.
policy-toml = ["governance", "dep:serde", "dep:toml"]

[dependencies]
console-subscriber = { version = "0.4", optional = true }
globset = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "tracing"] }
toml = { version = "1", optional = true }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
