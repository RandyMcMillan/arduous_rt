[package]
name = "arduous_rt"
version = "0.5.0"
edition = "2024"
readme = "README.md"
description = "Process-global named Tokio runtimes with nesting, reentrancy-safe execution, and stress-testing helpers"
license = "MIT"
repository = "https://github.com/RandyMcMillan/arduous_rt"
keywords = ["tokio", "runtime", "async", "concurrency"]
categories = ["asynchronous", "concurrency"]
rust-version = "1.85"

[features]
console = ["dep:console-subscriber"]
unbounded = []

[dependencies]
console-subscriber = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "tracing"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
