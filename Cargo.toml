[package]
name = "arduous_rt"
version = "0.3.0"
edition = "2024"
readme = "README.md"

[features]
console = ["dep:console-subscriber"]

[dependencies]
console-subscriber = { version = "0.4", optional = true }
once_cell = "1.19.0"
tokio = { version = "1", features = ["full", "tracing"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
