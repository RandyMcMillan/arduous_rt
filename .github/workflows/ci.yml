name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features
      - name: test (explicit_name)
        run: cargo test --features explicit_name
      - name: example smoke tests
        run: |
          cargo run --example trace_demo
          cargo run --example cooperating_runtimes
          cargo run --example nested_runtimes
          cargo run --example demo_backpressure
          cargo run --example demo_panic
          cargo run --example stress_test

  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - cargo test
          - cargo test --features explicit_name
          - cargo test --features governance
          - cargo test --all-features
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: ${{ matrix.test }}
