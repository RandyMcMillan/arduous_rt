name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# External network smoke tests. The CI workflow owns the fmt/clippy/unit
# gates; this job exists for the #[ignore]d httpbin.org/example.com tests.
jobs:
  external:
    name: External tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run all tests including ignored (external) tests
        run: cargo test --verbose -- --include-ignored
